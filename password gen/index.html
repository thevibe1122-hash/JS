<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>password generator</h1>

        <label for="password_length">password length</label>
        <input type="number" id="password_length" value="12" min="0" max="100">
        <label for="password" id="pl"> password: </label>
        <div class="password-wrapper">
            <p id="password"> </p>
            <button id="copy-btn" title="Copy to clipboard">
                <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
        </div>


        <div class="check-box">
            <input type="checkbox" id="lowercase" checked class="checkbox">
            <label for="">Include Lowercase</label> <span class="indicator" id="LI"><span class="inner-indicator"
                    id="LII"></span></span>

            <input type="checkbox" id="uppercase" checked class="checkbox">
            <label for="">Include Uppercase</label> <span class="indicator" id="UI"><span class="inner-indicator"
                    id="UII"></span></span>

            <input type="checkbox" id="numbers" checked class="checkbox">
            <label for="">Include Numbers</label> <span class="indicator" id="NI"><span class="inner-indicator"
                    id="NII"></span></span>

            <input type="checkbox" id="symbols" checked class="checkbox">
            <label for="">Include Symbols</label> <span class="indicator" id="SI"><span class="inner-indicator"
                    id="SII"></span></span>
        </div>

        <button id="generate-btn">generate password</button>
    </div>

    <script src="index.js"></script>
</body>

</html>

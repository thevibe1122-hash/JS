<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my website</title>
    <link rel="stylesheet" href="style.css">
    <header>
        <h1>Hangman</h1>
    </header>
</head>

<body>

    <section>
        <p>Guess the word by entering one letter at a time.</p>
    </section>
    <div class="game-box">
        <div class="left-side">
            <img src="img\Hangman-0.png" alt="" id="img">
            <p id="attempts">You have 6 attempts remaining.</p>
        </div>
        <div class="right-side">
            <p id="word">Word: _ _ _ _ _</p>
        </div>
    </div>

    <div class="keyboard">
        <button id="a">A</button>
        <button id="b">B</button>
        <button id="c">C</button>
        <button id="d">D</button>
        <button id="e">E</button>
        <button id="f">F</button>
        <button id="g">G</button>
        <button id="h">H</button>
        <button id="i">I</button>
        <button id="j">J</button>
        <button id="k">K</button>
        <button id="l">L</button>
        <button id="m">M</button>
        <button id="n">N</button>
        <button id="o">O</button>
        <button id="p">P</button>
        <button id="q">Q</button>
        <button id="r">R</button>
        <button id="s">S</button>
        <button id="t">T</button>
        <button id="u">U</button>
        <button id="v">V</button>
        <button id="w">W</button>
        <button id="x">X</button>
        <button id="y">Y</button>
        <button id="z">Z</button>
        <button id="newgame">New Game</button>
    </div>





    <footer>
        <p>&copy; 2026 Hangman Game. All rights reserved.</p>
    </footer>
    <script src="index.js"></script>
</body>

</html>
